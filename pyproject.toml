[project]
name = "krwordrank"
version = "1.0.3"
description = "KR-WordRank: Korean Unsupervised Word/Keyword Extractor"
readme = "README.md"
license = { text = "LGPL" }
authors = [{ name = "Lovit", email = "soy.lovit@gmail.com" }]
requires-python = ">=3.12"
keywords = ["Korean word keyword extraction"]
dependencies = [
    "numpy>=1.18.4",
    "scipy>=1.4.1",
    "scikit-learn>=0.22.1",
]

[project.scripts]
krwordrank = "krwordrank.cli:main"

[project.urls]
Homepage = "https://github.com/lovit/KR-WordRank"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krwordrank"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "nbconvert>=7.17.0",
]

[tool.ruff]
line-length = 127
exclude = ["tutorials/", "evaluation/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
